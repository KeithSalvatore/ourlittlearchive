<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Little Letters ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/letters.css">

<body>
<main class="letters-page">
<a href="index.html" class="back-btn">← Back Home</a>
<section class="intro">
<span>♡ A FEW LITTLE PIECES OF MY HEART ♡</span>
<h1>Little Letters</h1>
<p>Nine little letters, each holding something I wanted you to remember.</p>
<p>Take your time. Open them whenever you're ready. ♡</p>
</section>
<section class="envelope-grid" id="envelopeGrid"></section>
<section class="opened-letter" id="openedLetter">
<button class="close-letter" id="closeLetter">×</button>
<div class="letter-paper">
<span class="letter-number" id="letterNumber"></span>
<h2 id="letterTitle"></h2>
<div class="letter-divider">♡</div>
<p id="letterText"></p>
<div class="letter-signature">— from my heart</div>
</div>
</section>
<section class="bottom-note">
<p>Some things are easier to write than to say.</p>
<span>So I left a few of them here for you. ♡</span>
</section>
</main>
<script src="javascrip/letters.js"></script>
</body>
</html>
